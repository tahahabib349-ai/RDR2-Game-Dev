name: Publish Phase 1 Web
# One publisher only: every push to main that touches the game (or this file) runs the full
# test suite, exports the single-threaded Web build and deploys it to GitHub Pages.
# Generated files are uploaded as a Pages artifact, never committed. The gh-pages branch is
# no longer used for publishing (see its README), so nothing can redeploy an old build.
on:
  push:
    branches: [main]
    paths: [game/**, .github/workflows/publish-web.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: phase-one-web
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: phase-one-web
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Godot and run full tests
        run: game/tools/setup.sh
      - name: Export single-threaded Web build
        run: |
          game/tools/export_web.sh
          git rev-parse HEAD > game/export/web/source-commit.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/export/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
